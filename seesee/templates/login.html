{% extends "base.html" %}
{% block title %}Login — SeeSee{% endblock %}
{% block body %}
<div class="min-h-full flex items-center justify-center px-4 py-12">
    <div class="w-full max-w-sm space-y-8">
        <div class="text-center">
            <h1 class="text-3xl font-bold tracking-tight">
                <span class="text-mint">See</span><span>See</span>
            </h1>
            <p class="mt-2 text-sm text-gray-500 dark:text-gray-400">Sign in to your admin dashboard</p>
        </div>

        {% if error %}
        <div class="rounded-lg bg-red-50 dark:bg-red-900/20 border border-red-200 dark:border-red-800 p-4">
            <p class="text-sm text-red-700 dark:text-red-400">{{ error }}</p>
        </div>
        {% endif %}

        <form method="post" action="/login" class="space-y-5">
            <div>
                <label for="username" class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Username</label>
                <input type="text" id="username" name="username" required autocomplete="username"
                       class="block w-full rounded-lg border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-700 px-3 py-2 text-sm shadow-sm focus:border-mint focus:outline-none focus:ring-1 focus:ring-mint">
            </div>
            <div>
                <label for="password" class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Password</label>
                <input type="password" id="password" name="password" required autocomplete="current-password"
                       class="block w-full rounded-lg border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-700 px-3 py-2 text-sm shadow-sm focus:border-mint focus:outline-none focus:ring-1 focus:ring-mint">
            </div>
            <button type="submit"
                    class="w-full rounded-lg bg-mint px-4 py-2 text-sm font-semibold text-gray-900 shadow-sm hover:bg-mint/90 focus:outline-none focus:ring-2 focus:ring-mint focus:ring-offset-2 dark:focus:ring-offset-gray-900 transition-colors">
                Sign in
            </button>
        </form>
    </div>
</div>
{% endblock %}
