{% extends "base.html" %}
{% block title %}Login — SeeSee{% endblock %}
{% block body %}
<div class="min-h-full flex items-center justify-center px-4 py-12">
    <div class="w-full max-w-sm space-y-8">
        <div class="text-center">
            <h1 class="text-3xl font-bold tracking-tight">
                <span class="text-accent">See</span><span>See</span>
            </h1>
            <p class="mt-2 text-sm text-gray-500 dark:text-gray-400">Sign in to your admin dashboard</p>
        </div>

        {% if error %}
        <div class="rounded-lg bg-red-50 dark:bg-red-900/20 border border-red-200 dark:border-red-800 p-4">
            <p class="text-sm text-red-700 dark:text-red-400">{{ error }}</p>
        </div>
        {% endif %}

        <form method="post" action="/login" class="space-y-5" x-data="{ submitting: false }" @submit="submitting = true">
            <div>
                <label for="username" class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Username</label>
                <input type="text" id="username" name="username" required autocomplete="username"
                       class="block w-full rounded-lg border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-700 px-3 py-2 text-sm shadow-sm focus:border-accent focus:outline-none focus:ring-1 focus:ring-accent">
            </div>
            <div>
                <label for="password" class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Password</label>
                <input type="password" id="password" name="password" required autocomplete="current-password"
                       class="block w-full rounded-lg border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-700 px-3 py-2 text-sm shadow-sm focus:border-accent focus:outline-none focus:ring-1 focus:ring-accent">
            </div>
            <button type="submit" :disabled="submitting"
                    class="w-full rounded-lg bg-accent px-4 py-2 text-sm font-semibold text-gray-900 shadow-sm hover:bg-accent/90 focus:outline-none focus:ring-2 focus:ring-accent focus:ring-offset-2 dark:focus:ring-offset-gray-900 transition-colors disabled:opacity-50 disabled:cursor-not-allowed">
                <span x-show="!submitting">Sign in</span>
                <span x-show="submitting" class="inline-flex items-center gap-2">
                    <svg class="w-4 h-4 animate-spin" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"/><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"/></svg>
                    Signing in...
                </span>
            </button>
        </form>
    </div>
</div>
{% endblock %}
