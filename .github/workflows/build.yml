name: Build and Push Docker Image

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Format check
        run: ruff format --check .
      - name: Test
        run: pytest

  build:
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Generate Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - name: Compute build timestamp
        id: buildtime
        run: echo "time=$(date -u +'%Y-%m-%dT%H:%M:%S')" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v7
        with:
          push: true
          platforms: linux/amd64,linux/arm64
          build-args: |
            BUILD_TIME=${{ steps.buildtime.outputs.time }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Keep the published image a clean 2-arch manifest (no attestation
          # manifests / "unknown/unknown" entries that v6+ adds by default).
          provenance: false

      # Tell Coolify to pull the image we just pushed, via its manual GitHub
      # webhook — a synthetic, HMAC-signed push event. That surface is
      # signature-authenticated per app and (unlike /api/v1) not behind the
      # instance's IP allowlist, which is why the API is NOT used here.
      # Design + probes: freebird-fm repo,
      # docs/decisions/2026-08-17-deploy-trigger-signed-manual-webhook.md.
      # Both values live in Actions secrets; the step skips (not fails) when
      # they are absent so forks never try to deploy.
      - name: Trigger Coolify deploy
        if: github.ref == 'refs/heads/main'
        env:
          URL: ${{ secrets.COOLIFY_MANUAL_WEBHOOK_URL }}
          SECRET: ${{ secrets.COOLIFY_MANUAL_WEBHOOK_SECRET }}
        run: |
          if [ -z "$URL" ] || [ -z "$SECRET" ]; then
            echo "::notice::Coolify webhook secrets not set — skipping deploy."
            exit 0
          fi
          body='{"ref":"refs/heads/main","repository":{"full_name":"'"$GITHUB_REPOSITORY"'"},"commits":[]}'
          sig=$(printf '%s' "$body" | openssl dgst -sha256 -hmac "$SECRET" | awk '{print $NF}')
          resp=$(curl -fsS -X POST "$URL" \
            -H 'Content-Type: application/json' \
            -H 'X-GitHub-Event: push' \
            -H "X-Hub-Signature-256: sha256=$sig" \
            -d "$body")
          echo "Coolify responded: $resp"
          # The endpoint returns 200 even when it does nothing — the body is
          # the real signal. Fail loudly on the two known no-op shapes.
          if printf '%s' "$resp" | grep -qiE 'Invalid signature|Nothing to do'; then
            echo "::error title=Coolify did not deploy::The webhook answered but queued nothing. Check the app's git_repository/git_branch match and the COOLIFY_MANUAL_WEBHOOK_SECRET value."
            exit 1
          fi
